# nfpm package definition (https://nfpm.goreleaser.com). Driven by `make deb`,
# which exports:
#   VERSION    Debian version (git tag without the leading "v", or 0.0.0~git<sha>)
#   ARCH       Debian architecture: arm64, armhf or amd64
#   (@BUILD_DIR@ in contents is replaced by the Makefile with the directory
#   holding the cross-compiled binaries; nfpm does not expand env vars there.)
name: aslcp
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: ASLCP <noreply@users.noreply.github.com>
homepage: https://artw1.github.io/aslcp/
description: |
  Web control panel for AllStarLink 3 nodes.
  Connect and disconnect links, watch live node status and manage favorites
  from a browser. Runs as an unprivileged service next to Asterisk and talks
  to it over AMI. A small root helper performs package updates on request.

depends:
  - systemd
  - adduser
  - git
recommends:
  - asl3

contents:
  - src: "@BUILD_DIR@/aslcp"
    dst: /usr/bin/aslcp
    file_info:
      mode: 0755
  - src: "@BUILD_DIR@/aslcp-helper"
    dst: /usr/libexec/aslcp/aslcp-helper
    file_info:
      mode: 0755
  - src: packaging/aslcp.conf
    dst: /etc/aslcp/aslcp.conf
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp.service
    dst: /lib/systemd/system/aslcp.service
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-helper.socket
    dst: /lib/systemd/system/aslcp-helper.socket
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-helper.service
    dst: /lib/systemd/system/aslcp-helper.service
    file_info:
      mode: 0644
  - src: packaging/firewalld/aslcp.xml
    dst: /usr/lib/firewalld/services/aslcp.xml
    file_info:
      mode: 0644
  - src: packaging/copyright
    dst: /usr/share/doc/aslcp/copyright
    file_info:
      mode: 0644
  - src: packaging/THIRD-PARTY-NOTICES
    dst: /usr/share/doc/aslcp/THIRD-PARTY-NOTICES
    file_info:
      mode: 0644
  - src: packaging/README.package
    dst: /usr/share/doc/aslcp/README
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
  postremove: packaging/scripts/postrm.sh

deb:
  compression: xz
