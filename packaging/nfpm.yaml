# nfpm package definition (https://nfpm.goreleaser.com). Driven by `make deb`,
# which exports:
#   VERSION    Debian version (git tag without the leading "v", or 0.0.0~git<sha>)
#   ARCH       Debian architecture: arm64 or amd64
#   (@BUILD_DIR@ in contents is replaced by the Makefile with the directory
#   holding the cross-compiled binaries; nfpm does not expand env vars there.)
name: aslcp
arch: ${ARCH}
platform: linux
version: ${VERSION}
version_schema: none
section: net
priority: optional
maintainer: ASLCP <noreply@users.noreply.github.com>
homepage: https://w1jar.github.io/aslcp/
description: |
  Native radio node with a web control panel.
  One radio, one network mode at a time (AllStarLink, EchoLink or a digital
  mode), chosen and watched from a browser. The node (aslcp-node) runs on its
  own, without Asterisk; the panel talks to it over a local socket. A small
  root helper performs package updates and backups on request.

depends:
  - systemd
  - adduser
  - git

contents:
  - src: "@BUILD_DIR@/aslcp"
    dst: /usr/bin/aslcp
    file_info:
      mode: 0755
  - src: "@BUILD_DIR@/aslcp-helper"
    dst: /usr/libexec/aslcp/aslcp-helper
    file_info:
      mode: 0755
  - src: "@BUILD_DIR@/aslcp-node"
    dst: /usr/libexec/aslcp/aslcp-node
    file_info:
      mode: 0755
  - src: packaging/aslcp.conf
    dst: /etc/aslcp/aslcp.conf
    type: config|noreplace
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp.service
    dst: /lib/systemd/system/aslcp.service
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-helper.socket
    dst: /lib/systemd/system/aslcp-helper.socket
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-helper.service
    dst: /lib/systemd/system/aslcp-helper.service
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-node.service
    dst: /lib/systemd/system/aslcp-node.service
    file_info:
      mode: 0644
  - src: packaging/udev/60-aslcp-node.rules
    dst: /lib/udev/rules.d/60-aslcp-node.rules
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-wifi-watchdog.service
    dst: /lib/systemd/system/aslcp-wifi-watchdog.service
    file_info:
      mode: 0644
  - src: packaging/systemd/aslcp-wifi-watchdog.timer
    dst: /lib/systemd/system/aslcp-wifi-watchdog.timer
    file_info:
      mode: 0644
  - src: packaging/firewalld/aslcp.xml
    dst: /usr/lib/firewalld/services/aslcp.xml
    file_info:
      mode: 0644
  - src: packaging/copyright
    dst: /usr/share/doc/aslcp/copyright
    file_info:
      mode: 0644
  - src: packaging/THIRD-PARTY-NOTICES
    dst: /usr/share/doc/aslcp/THIRD-PARTY-NOTICES
    file_info:
      mode: 0644
  - src: packaging/README.package
    dst: /usr/share/doc/aslcp/README
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinst.sh
  preremove: packaging/scripts/prerm.sh
  postremove: packaging/scripts/postrm.sh

deb:
  compression: xz
