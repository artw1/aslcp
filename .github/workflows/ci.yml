name: CI

on:
  push:
    # try/** : experiment branches. The debs of the run are a test build to install
    # by hand on one node (download from the run page); nothing is published.
    branches: [main, 'release/**', 'try/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for the package version
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: web check and build (embedded UI)
        run: |
          cd web
          npm ci
          npm run check
      - name: Build debs (arm64, armhf, amd64; nothing is published)
        run: make debs
      - name: go test -race
        run: go test -race ./...
      - name: Package contents
        run: for f in dist/*.deb; do dpkg-deb -I "$f" | head -12; dpkg-deb -c "$f"; done
      - name: Artifact name
        id: art
        run: echo "name=debs-${GITHUB_REF_NAME//\//-}-$(make -s print-version)" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.name }}
          path: dist/*.deb
          retention-days: 14
